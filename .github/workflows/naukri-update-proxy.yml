name: Naukri Profile Update (WITH PROXY)

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '0 8 * * *'    # 1:30 PM IST
    - cron: '30 12 * * *'  # 6:00 PM IST

  workflow_dispatch:

jobs:
  update-naukri:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        playwright install chromium
        
    - name: Run Naukri updater with proxy
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
        PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
        PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
      run: python vps_setup.py
      
    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: naukri-screenshots
        path: |
          *.png
          logs/
