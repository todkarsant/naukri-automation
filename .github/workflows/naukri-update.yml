name: Naukri Profile Auto-Update

on:
  schedule:
    # Run at random-ish times between 7 AM - 8 PM IST (1:30 AM - 12:30 PM UTC)
    # IST = UTC + 5:30
    - cron: '30 1 * * *'   # ~7:00 AM IST
    - cron: '45 3 * * *'   # ~9:15 AM IST
    - cron: '15 5 * * *'   # ~10:45 AM IST
    - cron: '0 7 * * *'    # ~12:30 PM IST
    - cron: '30 9 * * *'   # ~2:00 PM IST
    - cron: '45 11 * * *'  # ~4:15 PM IST
    - cron: '15 13 * * *'  # ~6:45 PM IST

  workflow_dispatch: # Allow manual trigger for testing

jobs:
  update-naukri:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        npm install playwright
        
    - name: Install Playwright browsers
      run: npx playwright install chromium
      
    - name: Run Naukri updater
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
      run: node scripts/update-naukri.js
      
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: naukri-update-logs
        path: logs/
