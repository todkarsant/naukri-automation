name: Naukri Profile Auto-Update

on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '45 3 * * *'
    - cron: '15 5 * * *'
    - cron: '0 7 * * *'
    - cron: '30 9 * * *'
    - cron: '45 11 * * *'
    - cron: '15 13 * * *'

  workflow_dispatch:

jobs:
  update-naukri:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Debug - Show current script content
      run: |
        echo "=== SCRIPT CONTENT ==="
        head -100 scripts/update-naukri.js || true
        echo "=== CHECKING FOR :contains ==="
        grep -n ":contains" scripts/update-naukri.js || echo "No :contains found - GOOD!"
        echo "=== SCRIPT LINE COUNT ==="
        wc -l scripts/update-naukri.js
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        npm install playwright
        
    - name: Install Playwright browsers
      run: npx playwright install chromium
      
    - name: Run Naukri updater
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
      run: node scripts/update-naukri.js
      
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: naukri-update-logs
        path: logs/
