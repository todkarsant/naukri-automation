name: Naukri Profile Auto-Update

on:
  schedule:
    # Run at varied times between 7 AM - 8 PM IST (1:30 AM - 12:30 PM UTC)
    - cron: '30 1 * * *'   # ~7:00 AM IST
    - cron: '45 3 * * *'   # ~9:15 AM IST
    - cron: '15 5 * * *'   # ~10:45 AM IST
    - cron: '0 7 * * *'    # ~12:30 PM IST
    - cron: '30 9 * * *'   # ~2:00 PM IST
    - cron: '45 11 * * *'  # ~4:15 PM IST
    - cron: '15 13 * * *'  # ~6:45 PM IST

  workflow_dispatch:

jobs:
  update-naukri:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Naukri updater (Python API)
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
      run: python naukri_updater.py
      
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: naukri-update-logs
        path: |
          *.log
          cv-bank/resumes/*.pdf
